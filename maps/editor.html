<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FRAME Maps · Editor</title><meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:13px/1.45 Arial,Helvetica,sans-serif;color:#3F4443;background:#e9edef;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;background:#003349;color:#fff;border-bottom:3px solid #C6D83B}
header b{font-size:13px;letter-spacing:.12em;text-transform:uppercase}header .tpl{font-size:12px;color:#7BA7BC;letter-spacing:.08em;text-transform:uppercase}
header .sp{flex:1}header .st{font-size:12px;color:#C6D83B}
button{font:700 11.5px Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:7px 11px;cursor:pointer;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff}
button.solid{background:#C6D83B;border-color:#C6D83B;color:#003349}button:disabled{opacity:.45;cursor:default}
main{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0}main.hide-panel{grid-template-columns:0 minmax(0,1fr)}
#panel{overflow-y:auto;background:#fff;border-right:1px solid #d9dcdb;padding:12px 14px 40px}main.hide-panel #panel{display:none}
#frame{width:100%;height:100%;border:0;background:#2b3a42;display:block}
.sec{border:1px solid #e3e7e8;border-radius:10px;margin-bottom:12px;overflow:hidden}.sec>h3{margin:0;padding:9px 12px;background:#f2f4f4;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#003349;cursor:pointer;display:flex;justify-content:space-between}
.sec>div{padding:10px 12px;display:grid;gap:8px}.sec.closed>div{display:none}
label{display:grid;gap:3px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#005670}
input,select,textarea{font:13px Arial,sans-serif;color:#003349;border:1px solid #d9dcdb;border-radius:6px;padding:6px 8px;width:100%}textarea{min-height:56px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:12px;text-transform:none;letter-spacing:0;color:#3F4443;font-weight:400}.chk input{width:auto}
.item{border:1px solid #e3e7e8;border-radius:8px;padding:8px;display:grid;gap:6px;background:#fafbfb}.item .hd{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#003349}
.lnk{background:none;border:none;color:#005670;padding:2px 4px;text-transform:none;letter-spacing:0;font-size:12px}.lnk.red{color:#b42318}
.add{background:#fff;color:#005670;border:1px dashed #7BA7BC;width:100%}
.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.colors label{grid-template-columns:30px 1fr;align-items:center;text-transform:none;letter-spacing:0;font-weight:400;color:#3F4443;font-size:12px}
.colors input[type=color]{width:30px;height:28px;padding:1px}
.logo{display:flex;align-items:center;gap:8px}.logo img{height:30px;max-width:120px;object-fit:contain;background:#f2f4f4;border-radius:4px;padding:2px}
.note{font-size:11.5px;color:#6b716f}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:#003349;color:#fff;padding:9px 16px;border-radius:999px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}.toast.on{opacity:1}
dialog{border:none;border-radius:12px;padding:16px;width:min(560px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.4)}dialog textarea{min-height:180px;font:11px ui-monospace,monospace}
dialog .act{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}dialog button{color:#003349;border-color:#d9dcdb}
</style></head>
<body>
<header>
  <b>FRAME Maps</b><span class="tpl" id="tplName"></span><span class="sp"></span><span class="st" id="status">Loading…</span>
  <button id="bPanel">Map Settings</button>
  <button id="bPng">Download PNG</button><button id="bPdf">Download PDF</button>
  <button id="bCode">Map Code</button>
</header>
<main id="main"><aside id="panel"></aside><iframe id="frame" title="Map"></iframe></main>
<div class="toast" id="toast"></div>
<dialog id="dlg"><b>Map code</b><p class="note">Copy this to keep or move the map. Paste a code here and choose Load to open it.</p><textarea id="code"></textarea><div class="act"><button id="dCopy">Copy</button><button id="dLoad">Load</button><button id="dClose">Close</button></div></dialog>
<script src="engine/boot.js"></script>
<script>

  function panel() {

        el('div', { class: 'row' }, [field('Latitude', function () { return p.lat; }, function (v) { p.lat = v; }, { type: 'number' }), field('Longitude', function () { return p.lng; }, function (v) { p.lng = v; }, { type: 'number' })]),

        field('Details heading (in pop-ups)', function () { return cfg.detailsLabel; }, function (v) { cfg.detailsLabel = v; }),
        el('div', { class: 'row' }, [check('Market halos', function () { return p.showHalos !== false; }, function (v) { p.showHalos = v; }), field('Logo zoom level', function () { return p.detailZoom; }, function (v) { p.detailZoom = v; }, { type: 'number', min: 12, max: 15, step: 0.1 })]),
      ]));

          coords(c)] };
      }, function () { return { n: '', a: '', ll: null }; }, '+ Add location')]));

      P.appendChild(section('markets', 'Competitor Markets', [list(cfg.markets, function (m) {

          }, function () { return { n: '', a: '', ll: null, b: [], co: '', cl: [], no: [] }; }, '+ Add center')] };
      }, function () { return { id: 'm' + Date.now(), name: '', pos: [40, 40], centers: [] }; }, '+ Add market')]));
      var brands = {}; cfg.markets.forEach(function (m) { (m.centers || []).forEach(function (c) { (c.b || []).forEach(function (b) { brands[Array.isArray(b) ? b[0] : b] = 1; }); }); });
      cfg.logos = cfg.logos || {};
      var slug = function (s) { return String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); };
      P.appendChild(section('blogos', 'Competitor Logos', Object.keys(brands).length ? Object.keys(brands).sort().map(function (n) { var k = slug(n); return logoRow(n, cfg.logos[k], function (r) { cfg.logos[k] = r; }, function () { delete cfg.logos[k]; }); }).concat([el('p', { class: 'note', text: 'Brands without an upload use the FRAME logo library when it has them, else their name.' })]) : [el('p', { class: 'note', text: 'Add centers and competitors first.' })]));
      P.appendChild(section('reset', 'Layout', [el('button', { class: 'add', text: 'Reset panel positions', on: { click: function () { cfg.state = null; changed('now'); } } })]));
    }
  }
  function coords(c) {
    return el('div', {}, [el('div', { class: 'row' }, [field('Latitude', function () { return c.ll ? c.ll[1] : ''; }, function (v) { c.ll = [c.ll ? c.ll[0] : 0, v]; }, { type: 'number' }), field('Longitude', function () { return c.ll ? c.ll[0] : ''; }, function (v) { c.ll = [v, c.ll ? c.ll[1] : 0]; }, { type: 'number' })]),
      el('button', { class: 'lnk', text: 'Find from address', on: { click: function () { geocode(c.a, function (la, lo) { c.ll = [lo, la]; panel(); changed('now'); }); } } })]);
  }

  // ---------- export ----------
  function capture(kind) {
    var w = $('frame').contentWindow, doc = $('frame').contentDocument;
    var target = cfg.template === 'aerial' ? doc.getElementById('page') : Array.prototype.find.call(doc.querySelectorAll('[data-pg]'), function (n) { return n.style.left !== '-20000px'; });
    if (!target) return toast('The map is still loading');
    status('Preparing ' + kind.toUpperCase() + '…');
    var ensure = w.htmlToImage ? Promise.resolve() : new Promise(function (res, rej) { var s = doc.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js'; s.onload = res; s.onerror = rej; doc.head.appendChild(s); });
    ensure.then(function () {
      var tf = target.style.transform, hide = doc.createElement('style'); hide.textContent = '.edit-only{display:none!important}';
      doc.head.appendChild(hide); target.style.transform = 'none';
      return w.htmlToImage.toPng(target, { pixelRatio: 2, cacheBust: false }).then(function (png) { target.style.transform = tf; hide.remove(); return { png: png, w: target.offsetWidth, h: target.offsetHeight }; }, function (e) { target.style.transform = tf; hide.remove(); throw e; });
    }).then(function (r) {
      var name = String(cfg.title || 'map').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      if (kind === 'png') return deliver(name + '.png', r.png, 'image/png');
      return new Promise(function (res, rej) { if (window.jspdf) return res(); var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); }).then(function () {
        var pdf = new window.jspdf.jsPDF({ orientation: r.w > r.h ? 'landscape' : 'portrait', unit: 'px', format: [r.w, r.h], hotfixes: ['px_scaling'] });
        pdf.addImage(r.png, 'PNG', 0, 0, r.w, r.h); deliver(name + '.pdf', pdf.output('datauristring'), 'application/pdf');
      });
    }).catch(function (e) { status(''); toast('Could not export: ' + (e && e.message || 'try again')); });
  }
  function deliver(filename, dataURL, type) {
    if (connected) { send({ type: 'frame-map-export', filename: filename, dataURL: dataURL, mime: type }); status('Sent to FRAME to download'); return; }
    var a = document.createElement('a'); a.href = dataURL; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); status('Downloaded');
  }

  // ---------- header ----------
  $('bPanel').onclick = function () { $('main').classList.toggle('hide-panel'); };
  $('bPng').onclick = function () { capture('png'); };
  $('bPdf').onclick = function () { capture('pdf'); };
  $('bCode').onclick = function () { $('code').value = JSON.stringify(cfg); $('dlg').showModal(); };
  $('dClose').onclick = function () { $('dlg').close(); };
  $('dCopy').onclick = function () { $('code').select(); try { navigator.clipboard.writeText($('code').value); } catch (e) { document.execCommand('copy'); } toast('Copied'); };
  $('dLoad').onclick = function () { try { var c = JSON.parse($('code').value); if (!c.template) throw 0; cfg = c; panel(); render(); save(); $('dlg').close(); toast('Map loaded'); } catch (e) { toast('That code isn’t a FRAME map'); } };

  // ---------- start: wait for FRAME, else open locally ----------
  send({ type: 'frame-map-ready' });
  setTimeout(function () {
    if (connected) return;
    var q = new URLSearchParams(location.search), t = q.get('template');
    try { cfg = JSON.parse(localStorage.getItem('frame-map-local') || 'null'); } catch (e) {}
    if (!cfg || (t && cfg.template !== t)) cfg = blank(t || 'area');
    panel(); render(); status(host ? 'Not connected to FRAME · saving in this browser' : 'Saving in this browser');
  }, host ? 2500 : 0);
})();
</script>
</body></html>
